<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kabun — Regression Tests</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f4f4f4; --border: #d8d8d8;
    --text: #111111; --dim: #666666;
    --green: #1a8f3c; --green-dark: #146b2d; --green-tint: #e9f6ee;
    --red: #b3261e; --red-tint: #fdeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--dim); margin: 0 0 20px; }
  .summary {
    display: flex; gap: 10px; align-items: center; padding: 12px 16px;
    border-radius: 10px; font-weight: 700; font-size: 14px; margin-bottom: 20px;
  }
  .summary.pass { background: var(--green-tint); color: var(--green-dark); }
  .summary.fail { background: var(--red-tint); color: var(--red); }
  .group { margin-bottom: 22px; }
  .group-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 8px 2px;
  }
  .case {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px; font-size: 12.5px;
  }
  .case.fail { background: var(--red-tint); border-color: #f0c4c0; }
  .case .mark { flex: 0 0 auto; font-weight: 800; }
  .case.pass .mark { color: var(--green); }
  .case.fail .mark { color: var(--red); }
  .case .name { flex: 1; }
  .case .detail { display: block; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; color: var(--dim); margin-top: 3px; }

  /* Stub elements app.js touches at load time / during DOMContentLoaded.
     Hidden — this page isn't the real UI, just a harness. */
  #stubs { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Kabun — Regression Tests</h1>
  <p class="sub">Zero-dependency pure-function tests. Open this file directly in a browser — no server, no build step.</p>
  <div id="summary" class="summary">Running…</div>
  <div id="results"></div>
</div>

<!-- Minimal DOM stubs so app.js can load without crashing (it wires a few
     listeners at top level, outside DOMContentLoaded). Real network calls
     are blocked below before app.js ever runs. -->
<div id="stubs">
  <div id="modalOverlay"></div>
  <div id="bedDetailOverlay"></div>
  <div id="saleModalOverlay"></div>
  <div id="taskModalOverlay"></div>
  <div class="status-badge"></div>
  <select id="activityCategory"></select>
  <select id="bedScope"></select>
  <input type="date" id="logDate">
  <div id="logDatePills"><button type="button" class="date-pill-btn">Today</button><button type="button" class="date-pill-btn">Yesterday</button></div>
  <input type="date" id="saleDate">
  <div id="saleDatePills"><button type="button" class="date-pill-btn">Today</button><button type="button" class="date-pill-btn">Yesterday</button></div>
  <input type="date" id="taskDate">
  <div id="taskDatePills"><button type="button" class="date-pill-btn">Today</button><button type="button" class="date-pill-btn">Yesterday</button></div>

  <form id="saleForm"></form>

  <div id="modalTitle"></div>

  <div id="newCropField"></div>
  <div id="bedContextBar"></div>
  <div id="quickFormulaSection"></div>
  <div id="quickFormulaDoseCard"></div>
  <div id="inputsField"></div>
  <div id="financialsField"></div>
  <div id="toggleInputsBtn"></div>
  <div id="toggleFinancialsBtn"></div>
  <input id="logTankCount">
  <input id="newCropName">
  <input id="saleCrop">
  <input id="saleQty">
  <select id="saleUnit"></select>
  <input id="salePricePerUnit">
  <div id="saleTotalDisplay"></div>
  <input id="taskNote">
  <input type="checkbox" id="taskRepeat">
  <select id="taskActivityCategory"></select>
  <main></main>
</div>

<script>
  // Never let app.js reach the real backend or prompt for a PIN while
  // running tests — same discipline as manual browser-preview testing.
  window.fetch = () => Promise.reject(new Error("test.html: network blocked"));
  window.prompt = () => "test-pin";

  // Isolate from whatever real farm data might be cached under this origin.
  ["offline_farm_logs", "farmlog_beds_cache", "farmlog_formulas_cache",
   "farmlog_logs_cache", "farmlog_sales_cache", "farmlog_tasks_cache",
   "farmlog_last_bed", "farmlog_bed_max", "farmlog_auth_token",
   "farmlog_category_colors", "farmlog_weather_cache"
  ].forEach(k => localStorage.removeItem(k));
</script>
<script src="https://www.gstatic.com/firebasejs/10.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.15.0/firebase-firestore-compat.js"></script>
<script type="module">
  import * as State from "./js/state.js";
  import * as Calc from "./js/calculations.js";
  import * as Db from "./js/db.js";
  import * as Views from "./js/views.js";
  import * as App from "./js/app.js";

  // Re-expose to local test scope
  const { ymd, localDateStr, todayString, daysSince, escapeHtml, normalizeCropName, getCategoryColor, getCategoryColorMap, tintStyle, weatherIcon, lastActivityLabel, resolveTaskScopeMeta, resolveLogScopeLabel, getBed, getPlot, bedsInPlot, dateGroupLabel, DEFAULT_FORMULAS } = State;
  const { wateringAlert, latestWholeFarmWatering, latestPlotWatering, getWateringStatus, plotWateringRollup, groupByPlot, parseRecipe, renderIngredients, csvEscape, computeCropPL, calcSaleTotal } = Calc;
  const { planDayLabel } = Views;
  const { setDatePreset, syncDatePresets, addBed, saveBedName, saveBedPlot, stepTankCount, toggleSelectAllBeds } = App;

  // Sync window proxies with local test scope
  // We no longer shadow the global state with 'let' variables.
  // Tests must write directly to State.state.bedsData, etc.

  const groups = [];
  let current = null;

  function group(name) {
    current = { name, cases: [] };
    groups.push(current);
  }

  function test(name, fn) {
    try {
      fn();
      current.cases.push({ name, pass: true });
    } catch (e) {
      current.cases.push({ name, pass: false, detail: e.message });
    }
  }

  function assertEqual(actual, expected, label) {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${label || "assertEqual"}: expected ${b}, got ${a}`);
  }

  function assertTrue(value, label) {
    if (!value) throw new Error(`${label || "assertTrue"}: expected truthy, got ${JSON.stringify(value)}`);
  }

  // Serializes a local Date the way Apps Script actually returns a
  // Date-typed Sheets cell once JSON-stringified — a full ISO UTC timestamp,
  // not the plain "YYYY-MM-DD" the form itself writes.
  function sheetsIsoFor(localDateStr) {
    return new Date(localDateStr + "T00:00:00").toISOString();
  }

  function daysAgoStr(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return localDateStr(d);
  }

  // ---------------------------------------------------------------------
  group("ymd() — Sheets date normalization");

  test("passes a plain YYYY-MM-DD string through unchanged", () => {
    assertEqual(ymd("2026-07-10"), "2026-07-10");
  });

  test("empty/null/undefined all normalize to empty string", () => {
    assertEqual(ymd(""), "");
    assertEqual(ymd(null), "");
    assertEqual(ymd(undefined), "");
  });

  test("recovers the correct LOCAL calendar date from a Date-typed cell's ISO string", () => {
    // This is the exact bug that broke Tasks: a Date-typed Sheets cell
    // serializes as a full-ISO UTC timestamp. In Kudat (UTC+8), local
    // midnight today becomes "yesterday 16:00 UTC" — naive string
    // comparison would silently mismatch every date-based lookup.
    const today = todayString();
    assertEqual(ymd(sheetsIsoFor(today)), today);
  });

  test("normalizes correctly across a month boundary", () => {
    assertEqual(ymd(sheetsIsoFor("2026-08-01")), "2026-08-01");
  });

  // ---------------------------------------------------------------------
  group("wateringAlert() / latestWholeFarmWatering() — whole-farm watering blend");

  function bed(overrides) {
    return Object.assign({ bedNumber: 1, crops: [{ cropName: "Eggplant", plantingDate: "2026-06-01" }], lastWatered: null }, overrides);
  }

  test("no crops → never alerts, regardless of watering history", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    assertEqual(wateringAlert(bed({ crops: [], lastWatered: daysAgoStr(10) })), "");
  });

  test("never watered → alert with 'Not watered recently'", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    assertTrue(wateringAlert(bed({ lastWatered: null })).includes("Not watered recently"));
  });

  test("watered 1 day ago → no alert", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    assertEqual(wateringAlert(bed({ lastWatered: daysAgoStr(1) })), "");
  });

  test("watered 4 days ago, no whole-farm log → alert fires", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    assertTrue(wateringAlert(bed({ lastWatered: daysAgoStr(4) })).includes("Not watered in 4d"));
  });

  test("watered 4 days ago per-bed, but whole-farm watering logged yesterday → alert suppressed", () => {
    // Regression test for the audit's #1 finding: a "Whole Farm"-scoped
    // watering log previously never counted toward any bed's alert at all.
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(1), bedNumber: "all", activityCategory: "watering", status: "active" }
    ]));
    assertEqual(wateringAlert(bed({ lastWatered: daysAgoStr(4) })), "");
  });

  test("whole-farm log older than the bed's own lastWatered → bed's own (more recent) date wins", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(9), bedNumber: "all", activityCategory: "watering", status: "active" }
    ]));
    assertEqual(wateringAlert(bed({ lastWatered: daysAgoStr(1) })), "");
  });

  test("deleted whole-farm log is ignored", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(1), bedNumber: "all", activityCategory: "watering", status: "deleted" }
    ]));
    assertTrue(wateringAlert(bed({ lastWatered: daysAgoStr(4) })).includes("Not watered in 4d"));
  });

  test("getWateringStatus() returns plain data, not HTML — same decision wateringAlert() renders", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    assertEqual(getWateringStatus(bed({ lastWatered: daysAgoStr(4) })), { needsWater: true, days: 4 });
    assertEqual(getWateringStatus(bed({ lastWatered: daysAgoStr(1) })), { needsWater: false, days: 1 });
    assertEqual(getWateringStatus(bed({ crops: [], lastWatered: null })), { needsWater: false, days: null });
  });

  test("latestPlotWatering() only picks up matching plot-scoped logs, ignores deleted, returns null when none", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(5), bedNumber: "9", activityCategory: "watering", status: "active" },
      { id: "l2", date: daysAgoStr(3), bedNumber: "all", activityCategory: "watering", status: "active" },
      { id: "l3", date: daysAgoStr(2), bedNumber: "plot_x", activityCategory: "watering", status: "active" },
      { id: "l4", date: daysAgoStr(1), bedNumber: "plot_x", activityCategory: "watering", status: "deleted" },
      { id: "l5", date: daysAgoStr(1), bedNumber: "plot_y", activityCategory: "watering", status: "active" }
    ]));
    assertEqual(latestPlotWatering("plot_x"), daysAgoStr(2));
    assertEqual(latestPlotWatering("plot_z"), null);
    assertEqual(latestPlotWatering(null), null);
  });

  test("getWateringStatus() 3-way blend — plot-scoped log newer than both bed-own and whole-farm wins", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(5), bedNumber: "all", activityCategory: "watering", status: "active" },
      { id: "l2", date: daysAgoStr(1), bedNumber: "plot_row1", activityCategory: "watering", status: "active" }
    ]));
    const status = getWateringStatus(bed({ lastWatered: daysAgoStr(9), plotId: "plot_row1" }));
    assertEqual(status, { needsWater: false, days: 1 });
  });

  test("getWateringStatus() 3-way blend — whole-farm log newer than plot wins", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(1), bedNumber: "all", activityCategory: "watering", status: "active" },
      { id: "l2", date: daysAgoStr(9), bedNumber: "plot_row1", activityCategory: "watering", status: "active" }
    ]));
    const status = getWateringStatus(bed({ lastWatered: daysAgoStr(9), plotId: "plot_row1" }));
    assertEqual(status, { needsWater: false, days: 1 });
  });

  test("a bed with no plotId is unaffected by any plot-scoped log", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: daysAgoStr(1), bedNumber: "plot_row1", activityCategory: "watering", status: "active" }
    ]));
    const status = getWateringStatus(bed({ lastWatered: daysAgoStr(4), plotId: "" }));
    assertEqual(status, { needsWater: true, days: 4 });
  });

  // ---------------------------------------------------------------------
  group("getBed() — single front door for bed lookup");

  test("finds a bed by number, matching loosely (string vs number)", () => {
    State.state.bedsData = [{ bedNumber: 5, crops: [] }, { bedNumber: 12, crops: [] }];
    assertEqual(getBed(12).bedNumber, 12);
    assertEqual(getBed("12").bedNumber, 12);
  });

  test("returns undefined for a bed number that doesn't exist", () => {
    State.state.bedsData = [{ bedNumber: 5, crops: [] }];
    assertEqual(getBed(999), undefined);
  });

  // ---------------------------------------------------------------------
  group("getPlot() / bedsInPlot() / plotWateringRollup() — plot membership");

  test("getPlot() finds a plot by id", () => {
    State.state.plotsData = [{ id: "p1", name: "Eggplant Row", status: "active" }];
    assertEqual(getPlot("p1").name, "Eggplant Row");
    assertEqual(getPlot("nope"), undefined);
  });

  test("bedsInPlot() filters by exclusive plotId membership", () => {
    State.state.bedsData = [
      { bedNumber: 1, plotId: "p1", crops: [] },
      { bedNumber: 2, plotId: "p1", crops: [] },
      { bedNumber: 3, plotId: "p2", crops: [] },
      { bedNumber: 4, plotId: "", crops: [] }
    ];
    assertEqual(bedsInPlot("p1").map(b => b.bedNumber), [1, 2]);
    assertEqual(bedsInPlot("p2").map(b => b.bedNumber), [3]);
  });

  test("plotWateringRollup() counts flagged beds, ignoring an empty-crops bed", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    State.state.bedsData = [
      { bedNumber: 1, plotId: "p1", crops: [{ cropName: "Eggplant" }], lastWatered: daysAgoStr(5) },
      { bedNumber: 2, plotId: "p1", crops: [{ cropName: "Eggplant" }], lastWatered: daysAgoStr(1) },
      { bedNumber: 3, plotId: "p1", crops: [], lastWatered: daysAgoStr(9) } // empty bed — never flagged
    ];
    assertEqual(plotWateringRollup("p1"), { total: 3, flagged: 1 });
  });

  // ---------------------------------------------------------------------
  group("computeCropPL() — profit, cost-per-kg, intercropped splitting");

  test("intercropped log splits cost evenly across comma-joined crop names", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: "2026-07-01", cropName: "Eggplant, Okra", activityCategory: "watering", costRM: "10" }
    ]));
    localStorage.setItem("farmlog_sales_cache", "[]");
    const stats = computeCropPL();
    const eggplant = stats.find(s => s.cropName === "Eggplant");
    const okra = stats.find(s => s.cropName === "Okra");
    assertEqual(eggplant.cost, 5);
    assertEqual(okra.cost, 5);
  });

  test("harvest weight also splits evenly across intercropped names", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: "2026-07-01", cropName: "Eggplant, Okra", activityCategory: "harvest", costRM: "0", weight: "10" }
    ]));
    localStorage.setItem("farmlog_sales_cache", "[]");
    const stats = computeCropPL();
    assertEqual(stats.find(s => s.cropName === "Eggplant").weightKg, 5);
    assertEqual(stats.find(s => s.cropName === "Okra").weightKg, 5);
  });

  test("non-harvest logs never contribute weight, even if a weight value is present", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: "2026-07-01", cropName: "Eggplant", activityCategory: "watering", costRM: "0", weight: "999" }
    ]));
    localStorage.setItem("farmlog_sales_cache", "[]");
    assertEqual(computeCropPL().find(s => s.cropName === "Eggplant").weightKg, 0);
  });

  test("costPerKg is null with zero harvested weight, computed correctly otherwise", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l1", date: "2026-07-01", cropName: "Eggplant", activityCategory: "harvest", costRM: "8", weight: "12.5" }
    ]));
    localStorage.setItem("farmlog_sales_cache", "[]");
    const eggplant = computeCropPL().find(s => s.cropName === "Eggplant");
    assertEqual(eggplant.costPerKg, 8 / 12.5);

    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { id: "l2", date: "2026-07-01", cropName: "Okra", activityCategory: "watering", costRM: "4" }
    ]));
    assertEqual(computeCropPL().find(s => s.cropName === "Okra").costPerKg, null);
  });

  test("sales revenue attaches by trimmed crop name", () => {
    localStorage.setItem("farmlog_logs_cache", "[]");
    localStorage.setItem("farmlog_sales_cache", JSON.stringify([
      { id: "s1", crop: "  Eggplant  ", totalRevenue: "50" }
    ]));
    assertEqual(computeCropPL().find(s => s.cropName === "Eggplant").revenue, 50);
  });

  // ---------------------------------------------------------------------
  group("Date grouping — dateGroupLabel() / planDayLabel()");

  test("today's date groups as 'Today'", () => {
    assertTrue(dateGroupLabel(todayString()).startsWith("Today"));
  });

  test("yesterday groups as 'Yesterday'", () => {
    assertTrue(dateGroupLabel(daysAgoStr(1)).startsWith("Yesterday"));
  });

  test("older dates show only the short date, no relative label", () => {
    const label = dateGroupLabel(daysAgoStr(5));
    assertTrue(!label.startsWith("Today") && !label.startsWith("Yesterday"));
  });

  test("planDayLabel shows 'Today' for today but a weekday name for other dates", () => {
    assertTrue(planDayLabel(todayString()).startsWith("Today"));
    const future = new Date(); future.setDate(future.getDate() + 3);
    const label = planDayLabel(localDateStr(future));
    assertTrue(!label.startsWith("Today") && !label.startsWith("Yesterday"));
  });

  // ---------------------------------------------------------------------
  group("parseRecipe() / renderIngredients() — dosage calculator");

  test("parses a multi-ingredient recipe string", () => {
    assertEqual(parseRecipe("Neem oil:5:ml|Soap:2:g"), [
      { name: "Neem oil", amount: 5, unit: "ml" },
      { name: "Soap", amount: 2, unit: "g" }
    ]);
  });

  test("recipe without colons (free-text notes) returns null, not a crash", () => {
    assertEqual(parseRecipe("just spray it generously"), null);
    assertEqual(parseRecipe(""), null);
    assertEqual(parseRecipe(null), null);
  });

  test("ml doses scale by tank volume and round to whole ml", () => {
    // 5 ml/L in a 16 L sprayer → 80 ml. This is the math the farmer
    // actually mixes chemicals by — a scaling bug here is a safety bug.
    const html = renderIngredients([{ name: "Neem oil", amount: 5, unit: "ml" }], 16);
    assertTrue(html.includes(">80 ml<"), "expected 80 ml in: " + html);
  });

  test("g doses scale with one decimal, trailing .0 trimmed", () => {
    const html = renderIngredients([{ name: "Soap", amount: 2.5, unit: "g" }], 16);
    assertTrue(html.includes(">40 g<"), "expected 40 g in: " + html);
    const html2 = renderIngredients([{ name: "Soap", amount: 0.53, unit: "g" }], 16);
    assertTrue(html2.includes(">8.5 g<"), "expected 8.5 g in: " + html2);
  });

  test("invalid/zero volume falls back to the 16 L default", () => {
    const html = renderIngredients([{ name: "Neem oil", amount: 5, unit: "ml" }], "");
    assertTrue(html.includes(">80 ml<"), "expected 16L fallback in: " + html);
  });

  test("all 8 standard agricultural formulas parse accurately", () => {
    DEFAULT_FORMULAS.forEach(f => {
      const parsed = parseRecipe(f.recipe);
      assertTrue(Array.isArray(parsed) && parsed.length > 0, `Failed to parse formula: ${f.name}`);
      parsed.forEach(ing => {
        assertTrue(typeof ing.name === "string" && ing.name.length > 0, `Invalid ingredient name in ${f.name}`);
        assertTrue(typeof ing.amount === "number" && !isNaN(ing.amount) && ing.amount > 0, `Invalid amount in ${f.name}`);
        assertTrue(["ml", "g", "L", "tsp"].includes(ing.unit), `Invalid unit in ${f.name}: ${ing.unit}`);
      });
    });
  });

  test("standard formulas calculate correct dosages for 16L and 20L sprayer tanks", () => {
    // 1. Bio-Botanical Pest Shield (Bio Botava 2.5 ml/L, Garlic Oil 2 ml/L)
    const f1 = parseRecipe("Bio Botava:2.5:ml|Garlic Oil Extract:2:ml");
    const f1_16 = renderIngredients(f1, 16);
    assertTrue(f1_16.includes(">40 ml<") && f1_16.includes(">32 ml<"));
    const f1_20 = renderIngredients(f1, 20);
    assertTrue(f1_20.includes(">50 ml<") && f1_20.includes(">40 ml<"));

    // 2. Pest Guard Contact Spray (Pest Guard 3 ml/L, Garlic Oil 1.5 ml/L)
    const f2 = parseRecipe("Pest Guard 2:3:ml|Garlic Oil Extract:1.5:ml");
    const f2_16 = renderIngredients(f2, 16);
    assertTrue(f2_16.includes(">48 ml<") && f2_16.includes(">24 ml<"));
    const f2_20 = renderIngredients(f2, 20);
    assertTrue(f2_20.includes(">60 ml<") && f2_20.includes(">30 ml<"));

    // 3. Foliar Growth & Stress Mix (Amino 18 2 ml/L)
    const f3 = parseRecipe("Amino 18:2:ml");
    assertTrue(renderIngredients(f3, 16).includes(">32 ml<"));
    assertTrue(renderIngredients(f3, 20).includes(">40 ml<"));

    // 4. Calcium-Boron Bloom & Fruit Set (Wira CalBo 2 ml/L)
    const f4 = parseRecipe("Wira CalBo:2:ml");
    assertTrue(renderIngredients(f4, 16).includes(">32 ml<"));
    assertTrue(renderIngredients(f4, 20).includes(">40 ml<"));

    // 5. Combined Foliar Nutrition Boost (Amino 18 1.5 ml/L, Wira CalBo 1.5 ml/L)
    const f5 = parseRecipe("Amino 18:1.5:ml|Wira CalBo:1.5:ml");
    assertTrue(renderIngredients(f5, 16).includes(">24 ml<"));
    assertTrue(renderIngredients(f5, 20).includes(">30 ml<"));

    // 6. Antracol Protective Spray (Antracol 2 g/L)
    const f6 = parseRecipe("Antracol:2:g");
    assertTrue(renderIngredients(f6, 16).includes(">32 g<"));
    assertTrue(renderIngredients(f6, 20).includes(">40 g<"));

    // 7. Abamectin Mite & Thrip Knockdown (Abamectin 1 ml/L)
    const f7 = parseRecipe("Abamectin:1:ml");
    assertTrue(renderIngredients(f7, 16).includes(">16 ml<"));
    assertTrue(renderIngredients(f7, 20).includes(">20 ml<"));

    // 8. Cypermethrin Broad-Spectrum Knockdown (Cypermethrin 1.5 ml/L)
    const f8 = parseRecipe("Cypermethrin:1.5:ml");
    assertTrue(renderIngredients(f8, 16).includes(">24 ml<"));
    assertTrue(renderIngredients(f8, 20).includes(">30 ml<"));
  });

  test("fractional dosage scaling maintains precision without rounding artifacts", () => {
    const f = parseRecipe("Cypermethrin:1.5:ml|Bio Botava:2.5:ml");
    const html5L = renderIngredients(f, 5);
    assertTrue(html5L.includes(">7.5 ml<"), "expected 7.5 ml for 1.5ml/L * 5L");
    assertTrue(html5L.includes(">12.5 ml<"), "expected 12.5 ml for 2.5ml/L * 5L");
  });

  test("getCategoryColor() resolves default colors for all standard categories", () => {
    assertEqual(getCategoryColor("Biological"), "#0f8a8a");
    assertEqual(getCategoryColor("Botanical"), "#a3690b");
    assertEqual(getCategoryColor("Nutrition"), "#1a8f3c");
    assertEqual(getCategoryColor("Fungicide"), "#7b4fb5");
    assertEqual(getCategoryColor("Insecticide"), "#b3261e");
  });

  // ---------------------------------------------------------------------
  group("normalizeCropName() — crop identity (feeds P&L grouping)");

  test("snaps case-insensitively onto an existing crop name", () => {
    State.state.bedsData = [{ bedNumber: 1, crops: [{ cropName: "Kangkong", plantingDate: "2026-06-01" }], cropHistory: [] }];
    localStorage.setItem("farmlog_sales_cache", "[]");
    assertEqual(normalizeCropName("kangkong"), "Kangkong");
    assertEqual(normalizeCropName("KANGKONG"), "Kangkong");
  });

  test("trims whitespace and snaps", () => {
    State.state.bedsData = [{ bedNumber: 1, crops: [{ cropName: "Kangkong", plantingDate: "2026-06-01" }], cropHistory: [] }];
    assertEqual(normalizeCropName("  kangkong  "), "Kangkong");
  });

  test("unknown crop name passes through unchanged (trimmed)", () => {
    State.state.bedsData = [];
    localStorage.setItem("farmlog_sales_cache", "[]");
    assertEqual(normalizeCropName(" Bitter Gourd "), "Bitter Gourd");
  });

  test("also matches names known only from crop history and sales", () => {
    State.state.bedsData = [{ bedNumber: 1, crops: [], cropHistory: [{ cropName: "Okra" }] }];
    localStorage.setItem("farmlog_sales_cache", JSON.stringify([{ id: "s1", crop: "Cili Padi" }]));
    assertEqual(normalizeCropName("okra"), "Okra");
    assertEqual(normalizeCropName("cili padi"), "Cili Padi");
  });

  // ---------------------------------------------------------------------
  group("escapeHtml() — XSS guard");

  test("escapes angle brackets, ampersand, and both quote styles", () => {
    assertEqual(escapeHtml(`<img src=x onerror="alert('hi')">&`),
      "&lt;img src=x onerror=&quot;alert(&#39;hi&#39;)&quot;&gt;&amp;");
  });

  test("non-string input is stringified, not crashed on", () => {
    assertEqual(escapeHtml(42), "42");
    assertEqual(escapeHtml(null), "null");
  });

  // ---------------------------------------------------------------------
  group("resolveLogScopeLabel() — shared by renderLogs() and CSV export");

  test("blank or 'all' bedNumber resolves to Whole Farm", () => {
    assertEqual(resolveLogScopeLabel({ bedNumber: "all" }), "Whole Farm");
    assertEqual(resolveLogScopeLabel({ bedNumber: "" }), "Whole Farm");
    assertEqual(resolveLogScopeLabel({ bedNumber: null }), "Whole Farm");
  });

  test("a real bed number resolves to 'Bed N'", () => {
    assertEqual(resolveLogScopeLabel({ bedNumber: "7" }), "Bed 7");
  });

  test("a plot-scoped bedNumber resolves to the plot's name", () => {
    State.state.plotsData = [{ id: "plot_x", name: "Eggplant Row", status: "active" }];
    assertEqual(resolveLogScopeLabel({ bedNumber: "plot_x" }), "Eggplant Row");
  });

  test("a plot-scoped bedNumber for a since-deleted plot falls back gracefully", () => {
    State.state.plotsData = [];
    assertEqual(resolveLogScopeLabel({ bedNumber: "plot_gone" }), "Plot (deleted)");
  });

  // ---------------------------------------------------------------------
  group("csvEscape() — CSV export field quoting");

  test("plain value passes through unquoted", () => {
    assertEqual(csvEscape("Eggplant"), "Eggplant");
  });

  test("value containing a comma gets quoted", () => {
    assertEqual(csvEscape("Eggplant, Okra"), '"Eggplant, Okra"');
  });

  test("embedded quotes are doubled and the whole value quoted", () => {
    assertEqual(csvEscape('12" pot'), '"12"" pot"');
  });

  test("null/undefined become an empty string, not the literal word", () => {
    assertEqual(csvEscape(null), "");
    assertEqual(csvEscape(undefined), "");
  });

  // ---------------------------------------------------------------------
  group("resolveTaskScopeMeta() — Plot and Bed task scopes");

  test("resolves Whole Farm for empty bedNumber", () => {
    assertEqual(resolveTaskScopeMeta({ bedNumber: "" }), "Whole Farm");
    assertEqual(resolveTaskScopeMeta({ bedNumber: null }), "Whole Farm");
  });

  test("resolves Bed number for single bed", () => {
    assertEqual(resolveTaskScopeMeta({ bedNumber: 5 }), "Bed 5");
    assertEqual(resolveTaskScopeMeta({ bedNumber: "12" }), "Bed 12");
  });

  test("resolves Plot name for plot-scoped task", () => {
    State.state.plotsData = [{ id: "plot_eggplant", name: "Eggplant Plot" }];
    assertEqual(resolveTaskScopeMeta({ bedNumber: "plot_eggplant" }), "🗂️ Eggplant Plot");
  });

  test("multi-tank formula dosage scaling scales accurately across tanks", () => {
    const f = parseRecipe("Bio Botava:2.5:ml|Garlic Oil Extract:2:ml");
    const totalVol = 16 * 2; // 2 tanks of 16L = 32L
    const rendered = renderIngredients(f, totalVol);
    assertTrue(rendered.includes(">80 ml<"), "expected 80 ml Bio Botava for 2x16L tanks");
    assertTrue(rendered.includes(">64 ml<"), "expected 64 ml Garlic Oil for 2x16L tanks");
  });

  // ---------------------------------------------------------------------
  group("High-Density Bed Grid & Zero-Accordion Logic");

  test("groupByPlot correctly splits 22 eggplant beds into plot group", () => {
    State.state.plotsData = [{ id: "plot_eggplant", name: "Eggplant Plot" }];
    const beds = [];
    for (let i = 1; i <= 22; i++) {
      beds.push({ bedNumber: i, plotId: "plot_eggplant", crops: [{ cropName: "Eggplant" }] });
    }
    const { grouped, solo } = groupByPlot(beds);
    assertEqual(Object.keys(grouped).length, 1);
    assertEqual(grouped["plot_eggplant"].length, 22);
    assertEqual(solo.length, 0);
  });

  // ---------------------------------------------------------------------
  group("1-Tap Date Preset Chips & Sync");

  test("setDatePreset sets input value to today (offset 0)", () => {
    const btn = document.querySelector("#logDatePills .date-pill-btn");
    setDatePreset("logDate", 0, btn);
    assertEqual(document.getElementById("logDate").value, todayString());
    assertTrue(btn.classList.contains("active"));
  });

  test("setDatePreset sets input value to yesterday (offset 1)", () => {
    const btns = document.querySelectorAll("#logDatePills .date-pill-btn");
    const yestBtn = btns[1];
    setDatePreset("logDate", 1, yestBtn);
    const d = new Date(); d.setDate(d.getDate() - 1);
    assertEqual(document.getElementById("logDate").value, localDateStr(d));
    assertTrue(yestBtn.classList.contains("active"));
  });

  test("syncDatePresets reflects custom date changes by clearing active pills", () => {
    const input = document.getElementById("logDate");
    input.value = "2026-01-01";
    syncDatePresets("logDate");
    const btns = document.querySelectorAll("#logDatePills .date-pill-btn");
    btns.forEach(b => assertTrue(!b.classList.contains("active")));
  });

  // ---------------------------------------------------------------------
  group("Tier 2 Wet-Finger Stepper & Keypad Controls");

  test("stepTankCount increments tank count correctly", () => {
    const input = document.getElementById("logTankCount");
    input.value = "1";
    stepTankCount(1);
    assertEqual(input.value, "2");
    stepTankCount(2);
    assertEqual(input.value, "4");
  });

  test("stepTankCount decrements tank count with lower bound at 1", () => {
    const input = document.getElementById("logTankCount");
    input.value = "2";
    stepTankCount(-1);
    assertEqual(input.value, "1");
    stepTankCount(-1);
    assertEqual(input.value, "1", "tank count should not drop below 1");
  });

  // ---------------------------------------------------------------------
  group("3-Way Watering Logic Edge Cases");

  test("getWateringStatus resolves conflicting Bed vs Plot logs correctly", () => {
    // Bed watered 3 days ago, Plot watered today. Plot wins.
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { activityCategory: "watering", bedNumber: 5, date: daysAgoStr(3), status: "synced" },
      { activityCategory: "watering", bedNumber: "plot_test", date: todayString(), status: "synced" }
    ]));
    const bed = { bedNumber: 5, plotId: "plot_test", crops: [{ cropName: "Tomato" }] };
    const status = getWateringStatus(bed);
    assertEqual(status.days, 0, "Plot log should override older bed log");
    assertEqual(status.needsWater, false);
  });

  test("getWateringStatus flags needsWater for multi-day gaps", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { activityCategory: "watering", bedNumber: 5, date: daysAgoStr(4), status: "synced" }
    ]));
    const bed = { bedNumber: 5, crops: [{ cropName: "Tomato" }], lastWatered: daysAgoStr(4) };
    const status = getWateringStatus(bed);
    assertEqual(status.days, 4);
    assertEqual(status.needsWater, true, "Gap >= 3 days should need water");
  });

  // ---------------------------------------------------------------------
  group("Tank Stepper & Dilution Math Edge Cases");

  test("renderIngredients handles 0L volume correctly", () => {
    const f = parseRecipe("A:10:ml");
    const rendered = renderIngredients(f, 0);
    assertTrue(rendered.includes(">0 ml<") || rendered.includes(">160 ml<"), "Fallback to 16L if 0 or falsy");
    // Actually, parseFloat(0) is falsy in JS if written as `parseFloat(liters) || 16`
    // Let's test standard behavior (fallback to 16 if 0) vs explicit 0.
    const expected = (parseFloat(0) || 16) * 10;
    assertTrue(rendered.includes(">" + expected + " ml<"));
  });

  test("renderIngredients scales to extreme sprayer sizes (e.g. 1000L IBC tank)", () => {
    const f = parseRecipe("Fertilizer:5:ml");
    const rendered = renderIngredients(f, 1000);
    assertTrue(rendered.includes(">5000 ml<"), "1000L * 5ml/L should yield 5000ml");
  });

  test("parseRecipe handles multi-ingredient ratios and complex spacing", () => {
    const f = parseRecipe("  Part A : 1.5 : g | Part B: 2.25: ml  ");
    assertEqual(f.length, 2);
    assertEqual(f[0].name, "Part A");
    assertEqual(f[0].amount, 1.5);
    assertEqual(f[0].unit, "g");
    assertEqual(f[1].name, "Part B");
    assertEqual(f[1].amount, 2.25);
    assertEqual(f[1].unit, "ml");
  });

  // ---------------------------------------------------------------------
  group("Crop P&L Metrics Edge Cases");

  test("computeCropPL handles zero harvests and negative margins", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { cropName: "Failure Crop", activityCategory: "maintenance", costRM: "100", status: "synced" }
    ]));
    localStorage.setItem("farmlog_sales_cache", JSON.stringify([]));
    const pl = computeCropPL();
    assertEqual(pl.length, 1);
    assertEqual(pl[0].cropName, "Failure Crop");
    assertEqual(pl[0].cost, 100);
    assertEqual(pl[0].revenue, 0);
    assertEqual(pl[0].net, -100, "Net should be negative margin");
    assertEqual(pl[0].weightKg, 0);
    assertEqual(pl[0].costPerKg, null);
  });

  test("computeCropPL handles decimal rounding and shared costs accurately", () => {
    localStorage.setItem("farmlog_logs_cache", JSON.stringify([
      { cropName: "Crop A, Crop B", activityCategory: "maintenance", costRM: "33.33", status: "synced" },
      { cropName: "Crop A", activityCategory: "harvest", weight: "1.5", status: "synced" }
    ]));
    localStorage.setItem("farmlog_sales_cache", JSON.stringify([
      { crop: "Crop A", totalRevenue: "10.50" },
      { crop: "Crop B", totalRevenue: "20.15" }
    ]));
    const pl = computeCropPL();
    // Sorted by net: Crop B (20.15 - 16.665 = 3.485) vs Crop A (10.50 - 16.665 = -6.165)
    assertEqual(pl.length, 2);
    const cropB = pl.find(c => c.cropName === "Crop B");
    assertEqual(Math.abs(cropB.cost - 16.665) < 0.001, true);
    assertEqual(cropB.net, 20.15 - 16.665);
    const cropA = pl.find(c => c.cropName === "Crop A");
    assertEqual(cropA.weightKg, 1.5);
  });

  // ---------------------------------------------------------------------
  // Render results
  let total = 0, failed = 0;
  const resultsEl = document.getElementById("results");
  groups.forEach(g => {
    const box = document.createElement("div");
    box.className = "group";
    const title = document.createElement("p");
    title.className = "group-title";
    title.textContent = g.name;
    box.appendChild(title);
    g.cases.forEach(c => {
      total++;
      if (!c.pass) failed++;
      const row = document.createElement("div");
      row.className = "case " + (c.pass ? "pass" : "fail");
      row.innerHTML = `<span class="mark">${c.pass ? "✓" : "✕"}</span>` +
        `<span class="name">${c.name}${c.pass ? "" : `<span class="detail">${c.detail}</span>`}</span>`;
      box.appendChild(row);
    });
    resultsEl.appendChild(box);
  });

  const summary = document.getElementById("summary");
  summary.className = "summary " + (failed === 0 ? "pass" : "fail");
  summary.textContent = failed === 0
    ? `All ${total} tests passed`
    : `${failed} of ${total} tests failed`;

  // Isolation cleanup — leave localStorage as we found it.
  ["offline_farm_logs", "farmlog_beds_cache", "farmlog_formulas_cache",
   "farmlog_logs_cache", "farmlog_sales_cache", "farmlog_tasks_cache"
  ].forEach(k => localStorage.removeItem(k));
</script>
